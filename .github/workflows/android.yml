name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ZCUT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZCUT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZCUT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZCUT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zcut-release.jks"
            echo "ZCUT_KEYSTORE_PATH=$RUNNER_TEMP/zcut-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signing key
        if: steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::All ZCUT_* signing secrets are required for a release build."
          exit 1

      - name: Assemble signed release
        env:
          ZCUT_KEYSTORE_PASSWORD: ${{ secrets.ZCUT_KEYSTORE_PASSWORD }}
          ZCUT_KEY_ALIAS: ${{ secrets.ZCUT_KEY_ALIAS }}
          ZCUT_KEY_PASSWORD: ${{ secrets.ZCUT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcut-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.1.0"
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" \
              --title "Zcut $VERSION" \
              --notes "Automated signed build from $GITHUB_SHA."
          gh release upload "$VERSION" app/build/outputs/apk/release/app-release.apk --clobber
