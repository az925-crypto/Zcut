name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

  release:
    needs: test
    # Feature commits only run tests; releases are published from version tags.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ZCUT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZCUT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZCUT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZCUT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zcut-release.jks"
            echo "ZCUT_KEYSTORE_PATH=$RUNNER_TEMP/zcut-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signing key
        if: steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::All ZCUT_* signing secrets are required for a release build."
          exit 1

      - name: Assemble signed release
        env:
          ZCUT_KEYSTORE_PASSWORD: ${{ secrets.ZCUT_KEYSTORE_PASSWORD }}
          ZCUT_KEY_ALIAS: ${{ secrets.ZCUT_KEY_ALIAS }}
          ZCUT_KEY_PASSWORD: ${{ secrets.ZCUT_KEY_PASSWORD }}
          ZCUT_VERSION_NAME: ${{ github.ref_name }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Assert no network permission
        # Hard product rule: Zcut never talks to a first-party server. A dependency
        # must not smuggle INTERNET into the merged manifest.
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT2=$(ls -d "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          # Dump to a file first: piping into `grep -q` lets grep exit early and
          # SIGPIPE aapt2, which `pipefail` would report as "no match".
          "$AAPT2" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"
          cat "$RUNNER_TEMP/permissions.txt"
          if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/permissions.txt"; then
            echo "::error::INTERNET permission leaked into the merged manifest"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcut-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$GITHUB_REF_NAME"
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" \
              --title "Zcut $VERSION" \
              --notes "Automated signed build from $GITHUB_SHA."
          gh release upload "$VERSION" app/build/outputs/apk/release/app-release.apk --clobber
